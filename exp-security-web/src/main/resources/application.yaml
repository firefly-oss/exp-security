spring:
  application:
    name: exp-security
    version: 1.0.0
    description: Experience layer API for security-related user journeys
    team:
      name: Firefly Software Foundation
      email: dev@getfirefly.io
  threads:
    virtual:
      enabled: true
  # ---- DEMO ONLY: Redis disabled (no spring.data.redis is set, but the autoconfig still
  # tries localhost:6379 if the classes are on the classpath). Restore when Redis is reachable.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# ---- DEMO ONLY: idempotency cache forced to Caffeine so the AUTO resolver does NOT pick Redis. ----
firefly:
  cache:
    enabled: true
    default-cache-type: CAFFEINE
    redis:
      enabled: false

springdoc:
  packages-to-scan: com.firefly.experience.security.web.controllers
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true

server:
  port: ${SERVER_PORT:8101}
  address: ${SERVER_ADDRESS:localhost}
  shutdown: graceful

api-configuration:
  domain-platform:
    security-center:
      base-path: ${ENDPOINT_DOMAIN_SECURITY_CENTER:http://localhost:8030}
    common-sca:
      base-path: ${ENDPOINT_DOMAIN_COMMON_SCA:http://localhost:8041}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    com.firefly.experience.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.firefly: DEBUG

---
spring:
  config:
    activate:
      on-profile: pro
logging:
  level:
    com.firefly: INFO
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
